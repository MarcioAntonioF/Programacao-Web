<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Tarefa_03</title>
</head>

<body>

    <h1>DOM: Página Interativa com JavaScript</h1>

    <!-- CONTADOR -->
    <button id="incrementar">Incrementar</button>
    <button id="decrementar">Decrementar</button>

    <p id="contador">0</p>

    <br><br>

    <!-- INPUT TEXTO -->
    <input type="text" id="inputTexto" placeholder="Digite algo...">
    <p><span id="charCount">0</span> caracteres</p>

    <br>

    <!-- PARÁGRAFOS DINÂMICOS -->
    <div id="paragrafos"></div>

    <br><br>

    <!-- LISTAS -->
    <label>Escolha o tipo de lista:</label>
    <select id="tipoLista">
        <option value="ul">Lista Não Ordenada</option>
        <option value="ol">Lista Ordenada</option>
    </select>

    <button id="adicionarLista">Adicionar Lista</button>

    <br><br>

    <div id="listas"></div>

    <br>

    <!-- RESET -->
    <button id="resetar">Resetar Tudo</button>

    <script src="script.js"></script>

</body>

</html>
